name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /neike-306-tiku/
        run: pnpm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?name=github-pages`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error(`Artifact metadata request failed: ${response.status}`);
            const { artifacts = [] } = await response.json();
            if (artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
              console.log('Pages artifact metadata is available.');
              process.exit(0);
            }
            console.log(`Waiting for Pages artifact metadata (${attempt}/12).`);
            await setTimeout(5000);
          }
          throw new Error('Pages artifact metadata did not become available within 60 seconds.');
          NODE

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
