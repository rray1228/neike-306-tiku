name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /neike-306-tiku/
        run: pnpm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Use the REST artifact ID: the runner-scoped artifact listing can lag behind uploads.
            const route = '/repos/{owner}/{repo}';
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.request('GET ' + route + '/actions/runs/{run_id}/artifacts', {
                ...scope, run_id: context.runId, name: 'github-pages',
              });
              const matches = data.artifacts.filter(item => item.name === 'github-pages' && !item.expired);
              if (matches.length > 1) throw new Error('Multiple Pages artifacts found for this run.');
              if (matches.length === 1) { artifact = matches[0]; break; }
              await delay(5000);
            }
            if (!artifact) throw new Error('Pages artifact unavailable for this workflow run.');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request('POST ' + route + '/pages/deployments', {
              ...scope, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: idToken,
            });
            core.setOutput('page_url', deployment.page_url);
            core.info('Created Pages deployment ' + deployment.id);
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data: status } = await github.request('GET ' + route + '/pages/deployments/{deployment_id}', {
                ...scope, deployment_id: deployment.id,
              });
              if (status.status === 'succeed') {
                core.info('Pages deployment succeeded.');
                return;
              }
              if (['errored', 'failed', 'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'cancelled'].includes(status.status)) {
                throw new Error('Pages deployment failed: ' + status.status);
              }
              await delay(5000);
            }
            throw new Error('Pages deployment timed out.');
